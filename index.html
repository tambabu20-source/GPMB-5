<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard GPMB Tổ công tác số 5</title>
<style>
html,body{margin:0;min-height:100%;font-family:Arial,"Helvetica Neue",sans-serif;background:#f4f7f2;color:#17231d}.loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.box{max-width:520px;border:1px solid #d9e5d3;border-radius:8px;background:#fff;padding:18px;box-shadow:0 12px 30px rgba(38,58,43,.08)}.box strong{display:block;font-size:18px;margin-bottom:6px}.box span{color:#657268;font-size:13px}
</style>
</head>
<body>
<div class="loading"><div class="box"><strong>Đang tải dashboard GPMB Tổ công tác số 5</strong><span>Cập nhật hiển thị: tạm ẩn ghi chú tuần qua, giữ dữ liệu nền để đối chiếu lần sau.</span></div></div>
<script>
const DASHBOARD_SOURCE_COMMIT="bbb4a943eafce988f032a182e1c0b6e4583937e0";
const SHOW_WEEKLY_NOTES=false;
fetch(`https://raw.githubusercontent.com/tambabu20-source/GPMB-5/${DASHBOARD_SOURCE_COMMIT}/index.html`,{cache:"no-store"})
  .then(response=>{if(!response.ok)throw new Error("Không tải được dashboard nguồn");return response.text()})
  .then(html=>{
    const hideWeeklyCss=".weekly{display:none!important}";
    html=html.replace("</style>",hideWeeklyCss+"</style>");
    html=html.replace(
      'const hasWeekly=v=>/^\\s*Tuần qua:\\s*tăng/i.test(String(v||""));const weeklyHtml=v=>hasWeekly(v)?`<div class="weekly">${esc(v)}</div>`:"";',
      'const hasWeekly=v=>/^\\s*Tuần qua:\\s*tăng/i.test(String(v||""));const SHOW_WEEKLY_NOTES='+SHOW_WEEKLY_NOTES+';const weeklyHtml=v=>SHOW_WEEKLY_NOTES&&hasWeekly(v)?`<div class="weekly">${esc(v)}</div>`:"";'
    );
    document.open();
    document.write(html);
    document.close();
  })
  .catch(error=>{
    document.body.innerHTML='<div class="loading"><div class="box"><strong>Chưa tải được dashboard</strong><span>Vui lòng tải lại trang sau ít phút.</span></div></div>';
    console.error(error);
  });
</script>
</body>
</html>
